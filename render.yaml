services:
  - type: web
    name: ledgr-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Set these in the Render dashboard after import -- never commit real
      # keys. At least one AI provider key is needed for real investigation;
      # with none set, cases stay honestly ai_pending instead of a fake verdict.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # The deployed Vercel URL -- set this once the frontend is live, e.g.
      # https://ledgr.vercel.app (no trailing slash, comma-separate for more
      # than one, e.g. preview + production URLs).
      - key: FRONTEND_ORIGIN
        sync: false
